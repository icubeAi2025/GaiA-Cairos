<link rel="stylesheet" href="/assets/mo/css/quality-mo.css">

<section id="contentWrap"></section>

<script id="quality-list-template" type="text/x-handlebars-template">
    <div class="quality-mo-container">
        <!-- Header -->
        <header class="mo-header">
            <button class="back-btn" onclick="history.back()">←</button>
            <h2>품질검측관리</h2>
            <button class="add-btn" id="btnAdd">＋</button>
        </header>

        <!-- Filter -->
        <div class="filter-wrap">
            <select id="workTypeSelect" class="filter-select">
                <option value="">공종선택</option>
                {{#each data.workTypes}}
                    <option value="{{code}}">{{name}}</option>
                {{/each}}
            </select>

            <div class="search-bar">
                <input type="text" id="searchKeyword" placeholder="문서번호, 위치, 검측사항 검색" />
                <button type="button" class="search-btn" id="btnSearch">🔍</button>
            </div>
        </div>

        <!-- List -->
        <div class="inspection-list">
            {{#if data.inspections}}
                {{#each data.inspections}}
                <article class="inspection-card" onclick="openDetail('{{qlty_isp_id}}')">
                    <div class="card-header">
                        <div class="doc-no">{{isp_doc_no}}</div>
                        <span class="status {{statusClass}}">{{statusText}}</span>
                    </div>
                    <div class="card-body">
                        <div class="location">위치: {{isp_lct}}</div>
                        <div class="work-type">공종: {{cmn_cd_nm_krn}}</div>
                        <div class="issue">검측사항: {{isp_issue}}</div>
                        <div class="date">요청일: {{isp_req_dt}}</div>
                    </div>
                </article>
                {{/each}}
            {{else}}
                <div class="empty-list">등록된 검측 요청이 없습니다.</div>
            {{/if}}
        </div>
    </div>
</script>

<script>
    function loaded(pjtNo, cntrctNo) {
        console.log('품질검측 목록 로딩', pjtNo, cntrctNo);

        const params = {
            cntrctNo: cntrctNo,
            searchValue: '',
            selectedWorkType: ''
        };

        const apiUrl = '/api/construction/qualityinspection/get/qualityList';

        gaiaCommon.post(apiUrl, params, function (res) {
            console.log('품질검측 목록 응답', res);
            const list = res?.details?.qualitylist || [];

            const workTypes = [
                { code: 'A', name: '건축' },
                { code: 'C', name: '토목' },
                { code: 'F', name: '조경' },
                { code: 'T', name: '통신' },
                { code: 'M', name: '설비' },
                { code: 'E', name: '전기' },
                { code: 'O', name: '기타' }
            ];

            const inspections = list.map(item => ({
                ...item,
                statusText: convertStatusText(item.apprvl_stats, item.rslt_cd_nm),
                statusClass: convertStatusClass(item.apprvl_stats, item.rslt_cd_nm)
            }));

            // 화면 초기 렌더링
            $('#contentWrap').append(
                tware.utils.handlebarCompile($('#quality-list-template').html(), {
                    title: '품질검측관리',
                    pjtNo,
                    cntrctNo,
                    workTypes,
                    inspections
                })
            );

            // 공종 변경
            $(document).on('change.quality', '#workTypeSelect', function () {
                currentWorkType = $(this).val();
                loadQualityList(cntrctNo, currentSearchValue, currentWorkType);
            });

            // 검색
            $(document).on('click.quality', '#btnSearch', function () {
                currentSearchValue = $('#searchKeyword').val().trim();
                loadQualityList(cntrctNo, currentSearchValue, currentWorkType);
            });
        });
    }

    // 리스트 조회
    function loadQualityList(cntrctNo, searchValue, selectedWorkType) {
        const apiUrl = '/api/construction/qualityinspection/get/qualityList';
        const params = {
            cntrctNo: cntrctNo,
            searchValue: searchValue || '',
            selectedWorkType: selectedWorkType || ''
        };

        gaiaCommon.post(apiUrl, params, function (res) {
            console.log('품질검측 목록 응답', res);
            const list = res?.details?.qualitylist || [];

            const data = {
                inspections: list.map(item => ({
                    ...item,
                    statusText: convertStatusText(item.apprvl_stats, item.rslt_cd_nm),
                    statusClass: convertStatusClass(item.apprvl_stats, item.rslt_cd_nm)
                }))
            };

            // 기존 목록 영역만 다시 렌더링
            const listHtml = data.inspections.length
                ? data.inspections.map(createInspectionCard).join('')
                : `<div class="empty-list">등록된 검측 요청이 없습니다.</div>`;

            $('.inspection-list').html(listHtml);
        });
    }

    /**
     * 목록 하나 렌더링
     */
    function createInspectionCard(item) {
        return `
        <article class="inspection-card" onclick="openDetail('${item.qlty_isp_id}')">
            <div class="card-header">
                <div class="doc-no">${item.isp_doc_no || '-'}</div>
                <span class="status ${item.statusClass}">${item.statusText}</span>
            </div>
            <div class="card-body">
                <div class="location">위치: ${item.isp_lct || '-'}</div>
                <div class="work-type">공종: ${item.cmn_cd_nm_krn || '-'}</div>
                <div class="issue">검측사항: ${item.isp_issue || '-'}</div>
                <div class="date">요청일: ${item.isp_req_dt || '-'}</div>
            </div>
        </article>`;
    }

    function convertStatusText(apprvl) {
        if (apprvl === '승인') return '결재 승인';
        if (apprvl === '반려') return '결재 반려';
        if (apprvl === '결재요청') return '결재 요청';
        return '작성중';
    }

    function convertStatusClass(apprvl) {
        if (apprvl === '승인') return 'status-approve';
        if (apprvl === '반려') return 'status-reject';
        if (apprvl === '결재요청') return 'status-request';
        return 'status-none';
    }

    function openDetail(qltyIspId) {
        const pjtNo = sessionStorage.getItem('pjtNo');
        const cntrctNo = sessionStorage.getItem('cntrctNo');
        location.href = `#quality-detail?pjtNo=${pjtNo}&cntrctNo=${cntrctNo}&qltyIspId=${qltyIspId}`;
    }
</script>
