<link rel="stylesheet" href="/assets/mo/css/quality-mo.css">

<section id="contentWrap"></section>

<script id="content-template" type="text/x-handlebars-template">
    <div class="quality-mo-container">
        <!-- Header -->
        <header class="mo-header">
            <button class="back-btn" onclick="history.back()">←</button>
            <h2>품질검측</h2>
            <button class="add-btn" id="btnSaveQuality">💾</button>
        </header>

        <!-- 검측 요청 정보 -->
        <div class="section">
            <h3 class="section-title">검측 요청 정보</h3>
            <div class="info-card edit-card">
                <div class="form-row">
                    <label>문서 번호 <span class="req">*</span></label>
                    <input type="text" id="ispDocNo" value="{{data.quality.ispDocNo}}" placeholder="문서번호 입력">
                </div>
                <div class="form-row">
                    <label>요청 일자</label>
                    <input type="date" id="ispReqDt" value="{{formatDate data.quality.ispReqDt}}">
                </div>
                <div class="form-row">
                    <label>위치</label>
                    <input type="text" id="ispLct" value="{{data.quality.ispLct}}" placeholder="위치 입력">
                </div>

                <div class="form-row">
                    <label>공종</label>
                    <select id="workTypeSelect">
                        <option value="">공종 선택</option>
                        <option value="A" {{#if (eq data.quality.cnsttyCd "A")}}selected{{/if}}>건축</option>
                        <option value="C" {{#if (eq data.quality.cnsttyCd "C")}}selected{{/if}}>토목</option>
                        <option value="F" {{#if (eq data.quality.cnsttyCd "F")}}selected{{/if}}>조경</option>
                        <option value="T" {{#if (eq data.quality.cnsttyCd "T")}}selected{{/if}}>통신</option>
                        <option value="M" {{#if (eq data.quality.cnsttyCd "M")}}selected{{/if}}>설비</option>
                        <option value="E" {{#if (eq data.quality.cnsttyCd "E")}}selected{{/if}}>전기</option>
                        <option value="O" {{#if (eq data.quality.cnsttyCd "O")}}selected{{/if}}>기타</option>
                    </select>
                    <select id="constructTypeSelect">
                    </select>

                    <select id="resourceTypeSelect">
                    </select>
                </div>

                <div class="form-row">
                    <label>검측 부위</label>
                    <input type="text" id="ispPart" value="{{data.quality.ispPart}}" placeholder="검측 부위 입력">
                </div>

                <div class="form-row">
                    <label>Activity</label>
                    <div class="input-icon">
                        <textarea id="activityNm" readonly placeholder="Activity 명 선택">{{data.activityJoined}}</textarea>
                        <button type="button" class="icon-btn" id="btnSelectActivity">
                            <i class="ic-search">🔍</i>
                        </button>
                    </div>
                    <div id="activityHiddenWrap">
                        {{#each data.activitys}}
                        <input type="hidden" name="activityId" value="{{this.activityId}}">
                        <input type="hidden" name="wbsCd" value="{{this.wbsCd}}">
                        {{/each}}
                    </div>
                </div>

                <div class="form-row">
                    <label>검측 사항</label>
                    <textarea id="ispIssue" placeholder="검측 사항을 입력하세요">{{data.quality.ispIssue}}</textarea>
                </div>
            </div>
        </div>
        <!-- 체크리스트 -->
        <div class="section">
            <h3 class="section-title">체크리스트</h3>

            <div id="checklistSection" class="info-card checklist-box">
                <div class="checklist-header">
                    <span class="col-item">검사 항목</span>
                    <span class="col-site">시공</span>
                </div>

                {{#if data.checkList.length}}
                    <ul class="checklist-list">
                    {{#each data.checkList}}
                    <li class="checklist-row">
                    <div class="check-content">
                        <span class="check-title">{{this.chklstSno}}. {{this.chklstDscrpt}}</span>
                        <div class="check-icons">
                        <input type="checkbox" name="cnstrtnYn" {{#if (eq this.cnstrtnYn 'Y')}}checked{{/if}}>
                        </div>
                        <input type="hidden" name="chklstId" value="{{this.chklstId}}">
                        <input type="hidden" name="chklstBssCd" value="{{this.chklstBssCd}}">
                        <input type="hidden" name="chklstSno" value="{{this.chklstSno}}">
                    </div>
                    </li>
                    {{/each}}
                    </ul>
                {{else}}
                    <p class="empty">등록된 체크리스트가 없습니다.</p>
                {{/if}}
            </div>
        </div>     
        <!-- ===== 첨부파일 영역 ===== -->
        <div class="section">
            <h3 class="section-title">첨부파일 관리</h3>

            <!-- 파일 요약 -->
            <div class="info-card">
                <div class="info-row">
                    <strong>첨부파일</strong>
                    <span>{{data.fileCnt}} 개</span>
                </div>
                <div class="info-row link-row">
                    <a href="#" class="view-detail" onclick="toggleFileList(event)">자세히 보기</a>
                </div>
            </div>

            <!-- 파일 상세 리스트 -->
            <div id="fileListWrap" style="display:none;">
                <div class="file-section">
                    <div class="file-upload">
                        <label for="fileInput" class="btn-upload">파일 추가</label>
                        <input type="file" id="fileInput" multiple style="display:none;">
                    </div>
                    <ul id="fileList">
                        {{#if data.attachments.length}}
                            {{#each data.attachments}}
                                <li class="file-item" data-file-no="{{this.fileNo}}" data-sno="{{this.sno}}">
                                    <span class="file-name">{{this.fileNm}}</span>
                                    <button type="button" class="delete-file-btn">❌</button>
                                </li>
                            {{/each}}
                        {{else}}
                            <p class="empty">첨부 파일이 없습니다.</p>
                        {{/if}}
                    </ul>
                </div>
            </div>
        </div>
        <!-- ===== 사진파일 영역 ===== -->
        <div class="section">
            <h3 class="section-title">사진파일 관리</h3>

            <!-- 사진 요약 -->
            <div class="info-card">
                <div class="info-row">
                    <strong>사진파일</strong>
                    <span>{{data.photoCnt}} 개</span>
                </div>
                <div class="info-row link-row">
                    <a href="#" class="view-detail" onclick="togglePhotoList(event)">자세히 보기</a>
                </div>
            </div>

            <!-- 사진 리스트 -->
            <div id="photoListWrap" style="display:none;">
                <div class="photo-grid" id="photoList">
                    {{#if data.mergedPhotos.length}}
                        {{#each data.mergedPhotos}}
                            <div class="photo-item" data-file-no="{{this.fileNo}}" data-sno="{{this.sno}}">
                                <img src="{{this.imgSrc}}" alt="{{this.fileName}}" class="thumb">
                                <div class="photo-meta">
                                    <p class="photo-title">{{this.titlNm}}</p>
                                    <p class="photo-desc">{{this.fileDscrpt}}</p>
                                    <p class="photo-date">{{this.shotDateFmt}}</p>
                                </div>
                                <button type="button" class="delete-photo-btn">❌</button>
                            </div>
                        {{/each}}
                    {{else}}
                        <p class="empty">사진 파일이 없습니다.</p>
                    {{/if}}
                </div>
                <div class="photo-actions">
                    <button type="button" class="btn-primary" id="btnAddPhoto">사진 추가</button>
                    <button type="button" class="btn-secondary" id="btnTakePhoto">촬영</button>
                </div>
            </div>
        </div>
        <!-- Footer -->
        <footer class="mo-footer btn-area">
            <button type="button" class="btn-primary" onclick="deleteQuality()">삭제</button>
            <button type="button" class="btn-secondary" id="btnRequestTech">검측요청</button>
        </footer>
    </div>
    <!-- Activity 모달 -->
    <div id="activityModal" class="modal-overlay" style="display:none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Activity 선택</h3>
                <button class="modal-close" id="btnCloseModal">×</button>
            </div>
            <div class="modal-body">
                <div class="search-bar">
                    <input type="text" id="activitySearch" placeholder="검색어 입력">
                    <button id="btnSearchActivity">검색</button>
                </div>
                <div id="activityList">
                    <p class="loading-text">데이터를 불러오는 중...</p>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-save" id="btnSaveActivity">저장</button>
            </div>
        </div>
    </div>
    <!-- 사진 추가 모달 -->
    <div id="photoModal" class="modal-overlay" style="display:none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3>사진 추가</h3>
                <button class="modal-close" id="btnClosePhotoModal">×</button>
            </div>

            <div class="modal-body">
                <div class="form-row">
                    <label>제목</label>
                    <input type="text" id="titlNm" placeholder="사진 제목 입력">
                </div>
                <div class="form-row">
                    <label>설명</label>
                    <textarea id="dscrpt" placeholder="사진 설명 입력"></textarea>
                </div>
                <div class="form-row">
                    <label>촬영일자</label>
                    <input type="date" id="shotDate">
                </div>
                <div class="form-row">
                    <div class="photo-input-group">
                        <input type="file" id="photoFile" accept="image/*" style="display:none;">
                        <input type="file" id="photoCamera" accept="image/*" capture="camera" style="display:none;">
                        <button type="button" id="btnSelectPhoto" class="btn-upload">사진 추가</button>
                        <button type="button" id="btnTakePhoto" class="btn-camera">촬영</button>
                        <span id="selectedPhotoName" class="file-name"></span>
                    </div>
                </div>
                <div id="photoPreviewWrap" style="display:none; text-align:center; margin-top:10px;">
                    <img id="photoPreview" src="" alt="미리보기" style="max-width:100%; border-radius:8px;">
                </div>
            </div>

            <div class="modal-footer">
                <button class="btn-save" id="btnSavePhoto">저장</button>
            </div>
        </div>
    </div>
</script>

<script>
    Handlebars.registerHelper('formatDate', function (dateString) {
        if (!dateString) return '';
        const d = new Date(dateString);
        const yyyy = d.getFullYear();
        const mm = String(d.getMonth() + 1).padStart(2, '0');
        const dd = String(d.getDate()).padStart(2, '0');
        return `${yyyy}-${mm}-${dd}`;
    });

    Handlebars.registerHelper('eq', (a, b) => a === b);


    /**
     * 화면 초기
     */
    function getUrlParam(name) {
        const query = location.hash.split('?')[1] || '';
        const params = new URLSearchParams(query);
        return params.get(name);
    }

    function loaded(pjtNo, cntrctNo) {
        const qltyIspId = getUrlParam('qltyIspId');

        console.log('품질 검측 수정화면 로딩', { pjtNo, cntrctNo, qltyIspId });

        gaiaCommon.get(`/api/construction/qualityinspection/get/quality/${cntrctNo}/${qltyIspId}`, {}, function (res) {
            const details = res.details;
            console.log('데이터:', details);

            // 파일 개수 계산
            details.photoCnt = details.photoAttachments.length;
            details.fileCnt = details.attachments.length;

            // photoList + photoAttachments 병합
            const photoMap = {};
            (details.photoAttachments || []).forEach(att => {
                photoMap[att.sno] = att;
            });

            details.mergedPhotos = (details.photoList || []).map(photo => {
                const file = photoMap[photo.phtSno] || {};
                let formattedDate = '';
                if (Array.isArray(photo.shotDate)) {
                    const [y, m, d] = photo.shotDate;
                    formattedDate = `${y}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                }

                // 경로 정제 처리
                let webPath = file.fileDiskPath || '';
                if (webPath.includes('\\')) {
                    webPath = webPath.replace(/^.*\\upload/, '/upload').replace(/\\/g, '/');
                } else {
                    webPath = webPath.replace(/^.*\/upload/, '/upload');
                }

                const imgSrc = `${webPath}/${file.fileDiskNm}`;

                return {
                    ...photo,
                    sno: photo.phtSno,
                    fileNo: file.fileNo || photo.atchFileNo,
                    filePath: webPath,
                    fileName: file.fileNm,
                    fileDiskNm: file.fileDiskNm,
                    imgSrc: imgSrc,
                    shotDateFmt: formattedDate
                };
            });

            if (details.activitys && details.activitys.length > 0) {
                details.activityJoined = details.activitys
                    .map(a => a.activityNm)
                    .join('\n');
            }

            $('#contentWrap').html(
                tware.utils.handlebarCompile($('#content-template').html(), details)
            );

            if (details.activitys && details.activitys.length > 0) {
                $('#activityNm').data('selectedActivities', details.activitys);
            }

            bindWorkTypeSelect(cntrctNo);   // 공종 연동 이벤트 바인딩
            bindActivityEvents(cntrctNo);   // 액티비티 모달 관련 이벤트 바인딩

            mobileFile.init(details.attachments || []);
            photo.init(details.mergedPhotos || []);

            // 초기 공종 데이터 설정
            setTimeout(() => {
                makeCnsSelectBox(cntrctNo, details.quality.cnsttyCd, "constructTypeSelect", details.quality.cnsttyCdL1)
                    .then(() => makeCnsSelectBox(cntrctNo, details.quality.cnsttyCdL1, "resourceTypeSelect", details.quality.cnsttyCdL2));
            }, 200);

            // 버튼 이벤트 등록
            $('#btnSaveQuality').on('click', () => updateQualityApi(cntrctNo, qltyIspId));
        });
    }

    /**
     * 저장
     */
    function updateQualityApi(cntrctNo, qltyIspId) {
        const formData = new FormData();

        // ===== 기본 검측 데이터 =====
        const ispDocNo = $('#ispDocNo').val();
        const ispReqDt = $('#ispReqDt').val();
        const ispLct = $('#ispLct').val();
        const cnsttyCd = $('#workTypeSelect').val();
        const cnsttyCdL1 = $('#constructTypeSelect').val();
        const cnsttyCdL2 = $('#resourceTypeSelect').val();
        const ispPart = $('#ispPart').val();
        const ispIssue = $('#ispIssue').val();

        if (!ispDocNo) return alert('문서번호를 입력하세요.');
        if (!ispReqDt) return alert('검측요청일자를 입력하세요.');

        // ===== Activity =====
        const activities = $('#activityNm').data('selectedActivities') || [];
        const activityList = activities.map(a => ({
            activityId: a.activityId,
            wbsCd: a.wbsCd,
        }));

        // ===== 체크리스트 =====
        const checkList = [];
        $('#checklistSection .checklist-row').each(function (index) {
            const $row = $(this);
            const chklstId = $row.find('input[name="chklstId"]').val();
            const chklstBssCd = $row.find('input[name="chklstBssCd"]').val();
            const chklstSno = $row.find('input[name="chklstSno"]').val();
            const chklstDscrpt = $row.find('.check-title').text().trim();
            const cnstrtnYn = $row.find('input[type="checkbox"]').is(':checked') ? 'Y' : 'N';

            if (chklstId) {
                checkList.push({
                    chklstId,
                    chklstBssCd,
                    chklstSno: index + 1,
                    chklstDscrpt,
                    cnstrtnYn
                });
            }
        });

        // ===== 사진 =====
        const photos = [];
        photo.photoArr.forEach(p => {
            photos.push({
                titlNm: p.titlNm,
                dscrpt: p.dscrpt,
                shotDate: p.shotDateFmt
            });

            // 새 파일만 multipart append
            if (p.file) {
                formData.append('photos', p.file);
            }
        });

        // ===== 삭제된 사진 =====
        const deleteSnos = (photo.deleteSno || []).map(Number);
        const deletePhtSnos = (photo.deletePhtSno || []).map(Number);

        // ===== 검측요청 데이터 =====
        const quality = {
            cntrctNo,
            qltyIspId,
            ispDocNo,
            ispReqDt,
            ispLct,
            cnsttyCd,
            cnsttyCdL1,
            cnsttyCdL2,
            ispPart,
            ispIssue,
            activity: activityList,
            checklist: checkList,
            photos: photos,
            deleteSno: deleteSnos,      // 사진 파일 삭제용 (CW_ATTACHMENTS)
            deletePhtSno: deletePhtSnos // 사진 메타 삭제용 (CW_QUALITY_PHOTO)
        };

        // JSON을 Blob으로 추가 (quality 객체 안에 deleteSno 포함)
        formData.append('quality', new Blob([JSON.stringify(quality)], { type: 'application/json' }), '');

        // ===== 첨부파일 =====
        mobileFile.newFiles.forEach(file => formData.append('files', file));

        // ===== 삭제된 첨부파일 =====
        if (mobileFile.removedFiles.length > 0) {
            mobileFile.removedFiles.forEach(f => {
                formData.append('removedFiles[]', f.fileNo);
                formData.append('removedSnos[]', f.sno);
            });
        }

        // ===== 저장 요청 =====
        gaiaCommon.post(
            '/api/construction/qualityinspection/update/quality',
            formData,
            function (res) {
                if (res.ok) {
                    alert('수정되었습니다.');
                    location.reload();
                } else {
                    alert(res.message || '저장 중 오류가 발생했습니다.');
                }
            },
            function (err) {
                console.error('품질검측 수정 실패:', err);
                alert('저장 중 오류가 발생했습니다.');
            }
        );
    }

    /**
     * 품질검측 단건 삭제
     */
    function deleteQuality() {
        const qltyIspId = getUrlParam('qltyIspId');

        if (!confirm('삭제하시겠습니까?')) {
            return;
        }

        const payload = {
            qualityList: [
                {
                    qltyIspId: qltyIspId,
                    cntrctNo: cntrctNo
                } 
            ],
            cmnCdNmKrn: '',
            rsltDocNo: ''
        };

        gaiaCommon.post(
            '/api/construction/qualityinspection/delete/qualityList',
            payload,
            function (res) {
                if (res.ok) {
                    alert('삭제되었습니다.');

                    location.href = `#quality-list?pjtNo=${pjtNo}&cntrctNo=${cntrctNo}`;
                } else {
                    alert(res.message || '삭제 중 오류가 발생했습니다.');
                }
            },
            function (err) {
                console.error('삭제 실패:', err);
                alert('삭제 중 오류가 발생했습니다.');
            }
        );
    }


    /**
     * 공종관련
     */
    function bindWorkTypeSelect(cntrctNo) {
        $(document).off("change", "#workTypeSelect");
        $(document).off("change", "#constructTypeSelect");
        $(document).off("change", "#resourceTypeSelect");

        // 공종1 선택 시 → 공종2 로드
        $(document).on("change", "#workTypeSelect", function () {
            const selectedValue = $(this).val();

            $("#constructTypeSelect").html('<option value="">=선택=</option>');
            $("#resourceTypeSelect").html('<option value="">=선택=</option>');
            resetChecklistSection("공종을 선택하면 체크리스트가 표시됩니다.");

            // 선택된 값이 있으면 공종2 로드
            if (selectedValue) {
                makeCnsSelectBox(cntrctNo, selectedValue, "constructTypeSelect");
            }
        });

        // 공종2 선택 시 → 공종3 로드
        $(document).on("change", "#constructTypeSelect", function () {
            const selectedValue = $(this).val();

            $("#resourceTypeSelect").html('<option value="">=선택=</option>');
            resetChecklistSection("공종을 선택하면 체크리스트가 표시됩니다.");

            if (selectedValue) {
                makeCnsSelectBox(cntrctNo, selectedValue, "resourceTypeSelect");
            }
        });

        // 공종3 선택 시 체크리스트 로드
        $(document).on("change", "#resourceTypeSelect", function () {
            const selectedValue = $(this).val();

            if (selectedValue) {
                loadCheckListFromApi(cntrctNo);
            } else {
                resetChecklistSection("등록된 체크리스트가 없습니다.");
            }
        });
    }

    // 체크리스트 초기화
    function resetChecklistSection(message) {
        $('#checklistSection').html(`
        <div class="checklist-header">
            <span class="col-item">검사 항목</span>
            <span class="col-site">시공</span>
        </div>
        <p class="empty">${message}</p>
    `);
    }

    // 서버에서 공종 데이터 가져오기
    function makeCnsSelectBox(cntrctNo, upCnsttyCd, targetId, defaultValue) {
        return new Promise((resolve) => {
            const param = { cntrctNo: cntrctNo, upCnsttyCd: upCnsttyCd };
            gaiaCommon.post("/api/construction/qualityinspection/selectbox", param, function (res) {
                const list = res.details.selectBox || [];
                const $target = $("#" + targetId);
                $target.html('<option value="">=선택=</option>');

                if (list.length === 0) {
                    alert("선택할 수 있는 공종이 없습니다.");
                    resolve();
                    return;
                }

                list.forEach(item => {
                    const selected = (defaultValue && item.cnstty_cd === defaultValue) ? "selected" : "";
                    $target.append(`<option value="${item.cnstty_cd}" ${selected}>${item.cnstty_nm}</option>`);
                });

                resolve();
            }, function (err) {
                console.error("공종 selectbox 조회 실패:", err);
                resolve();
            });
        });
    }


    /**
     * 체크리스트 관련
     */
    function renderCheckList(list) {
        if (!list || !list.length) {
            $('#checklistSection').html('<p class="empty">등록된 체크리스트가 없습니다.</p>');
            return;
        }

        let html = `
        <div class="checklist-header">
            <span class="col-item">검사 항목</span>
            <span class="col-site">시공</span>
        </div>
        <ul class="checklist-list">
    `;

        list.forEach(item => {
            html += `
            <li class="checklist-row">
                <div class="check-content">
                    <span class="check-title">${item.chklstSno}. ${item.chklstDscrpt}</span>
                    <div class="check-icons">
                        <input type="checkbox">
                    </div>
                    <input type="hidden" name="chklstId" value="${item.chklstId}">
                    <input type="hidden" name="chklstBssCd" value="${item.chklstBssCd}">
                </div>
            </li>
        `;
        });

        html += '</ul>';
        $('#checklistSection').html(html);
    }
    function loadCheckListFromApi(cntrctNo) {
        const cnsttyCd = $('#resourceTypeSelect').val();
        const upCnsttyCd = $('#constructTypeSelect').val();

        if (!cnsttyCd) {
            $('#checklistSection').html('<p class="empty">등록된 체크리스트가 없습니다.</p>');
            return;
        }

        const param = {
            cntrctNo: cntrctNo,
            cnsttyCd: cnsttyCd,
            upCnsttyCd: upCnsttyCd,
            searchValue: ""
        };

        $('#checklistSection').html('<p class="loading-text">체크리스트를 불러오는 중...</p>');

        gaiaCommon.post("/api/construction/qualityinspection/get/checklist", param, function (res) {
            let list = res.details.checkList || [];
            list = normalizeCheckListKeys(list);
            renderCheckList(list);
        }, function (err) {
            console.error('체크리스트 조회 실패:', err);
            $('#checklistSection').html('<p class="empty">체크리스트를 불러오지 못했습니다.</p>');
        });
    }
    function normalizeCheckListKeys(list) {
        return list.map(item => ({
            chklstId: item.chklstId || item.chklst_id || '',
            chklstBssCd: item.chklstBssCd || item.chklst_bss_cd || '',
            chklstSno: item.chklstSno || item.row_num || '',
            chklstDscrpt: item.chklstDscrpt || item.chklst_dscrpt || '',
        }));
    }


    /**
     * 액티비티 관련
     */
    function openActivityModal(cntrctNo) {
        $('#activityModal').show();
        $('#activityList').html('<p class="loading-text">데이터를 불러오는 중...</p>');
        loadActivityList(cntrctNo, '');
    }

    function closeActivityModal() {
        $('#activityModal').hide();

        $('#activitySearch').val('');
        $('#activityList').empty().html('<p class="loading-text">데이터를 불러오는 중...</p>');

        $('.activity-item').removeClass('selected');
    }

    function bindActivityEvents(cntrctNo) {
        // 돋보기 버튼
        $(document).on('click', '#btnSelectActivity', function () {
            openActivityModal(cntrctNo);
        });

        // 닫기 버튼
        $(document).on('click', '#btnCloseModal', function () {
            closeActivityModal();
        });

        // 검색 버튼
        $(document).on('click', '#btnSearchActivity', function () {
            const searchValue = $('#activitySearch').val().trim();
            loadActivityList(cntrctNo, searchValue);
        });

        // 저장 버튼
        $(document).on('click', '#btnSaveActivity', function () {
            saveSelectedActivitiesToParent();
            closeActivityModal();
        });
    }

    function loadActivityList(cntrctNo, searchValue) {
        $('#activityList').html('<p class="loading-text">데이터를 불러오는 중...</p>');

        const param = { cntrctNo: cntrctNo, searchValue: searchValue };

        gaiaCommon.post("/api/construction/qualityinspection/activity/list", param, function (res) {
            const list = res.details.activityList || [];
            if (!list.length) {
                $('#activityList').html('<p class="empty">검색된 Activity가 없습니다.</p>');
                return;
            }

            let html = '<ul class="activity-ul">';
            list.forEach(item => {
                html += `
                <li class="activity-item" 
                    data-id="${item.activity_id}" 
                    data-wbs="${item.wbs_cd}" 
                    data-name="${item.activity_nm}">
                    <strong>${item.activity_nm}</strong>
                    <p class="path">${item.path_nm || ''}</p>
                    <p class="date">시작: ${item.plan_start || '-'} / 종료: ${item.plan_finish || '-'}</p>
                </li>`;
            });
            html += '</ul>';
            $('#activityList').html(html);

            // 이전 선택 상태 복원
            const selected = $('#activityNm').data('selectedActivities') || [];
            selected.forEach(sel => {
                $(`.activity-item[data-id="${sel.activityId}"]`).addClass('selected');
            });

            // 클릭 시 선택 토글
            $('.activity-item').on('click', function () {
                $(this).toggleClass('selected');
            });
        }, function (err) {
            console.error('Activity 목록 조회 실패:', err);
            $('#activityList').html('<p class="empty">데이터를 불러오지 못했습니다.</p>');
        });
    }

    function saveSelectedActivitiesToParent() {
        const selected = [];
        const $hiddenWrap = $('#activityHiddenWrap');

        $hiddenWrap.empty();

        $('.activity-item.selected').each(function () {
            const id = $(this).data('id');
            const wbs = $(this).data('wbs');
            const name = $(this).data('name');

            selected.push({ activityId: id, wbsCd: wbs, activityNm: name });

            // hidden input 추가
            $hiddenWrap.append(`
            <input type="hidden" name="activityId" value="${id}">
            <input type="hidden" name="wbsCd" value="${wbs}">
        `);
        });

        // 부모 textarea에 표시
        const names = selected.map(s => s.activityNm).join('\n');
        $('#activityNm')
            .val(names)
            .data('selectedActivities', selected);
    }

    /**
     * 첨부파일 & 사진 
     */

    function toggleFileList(e) {
        e.preventDefault();
        const list = document.getElementById('fileListWrap');
        if (!list) return;
        if (list.style.display === 'none') {
            list.style.display = 'block';
            e.target.textContent = '닫기';
        } else {
            list.style.display = 'none';
            e.target.textContent = '자세히 보기';
        }
    }

    function togglePhotoList(e) {
        e.preventDefault();
        const list = document.getElementById('photoListWrap');
        if (!list) return;
        if (list.style.display === 'none') {
            list.style.display = 'block';
            e.target.textContent = '닫기';
        } else {
            list.style.display = 'none';
            e.target.textContent = '자세히 보기';
        }
    }

    window.mobileFile = window.mobileFile || {
        serverFiles: [],   // 서버에서 불러온 파일 목록
        newFiles: [],      // 새로 추가한 파일 목록
        removedFiles: [],  // 삭제할 서버 파일 목록

        init(attachments = []) {
            this.serverFiles = attachments.map(f => ({
                fileNm: f.fileNm,
                fileNo: f.fileNo,
                sno: f.sno
            }));
            this.newFiles = [];
            this.removedFiles = [];
            this.render();
            this.bindEvents();
        },

        bindEvents() {
            // 파일 선택 시
            $(document).off('change', '#fileInput').on('change', '#fileInput', (e) => {
                const files = Array.from(e.target.files);
                if (files.length) {
                    this.newFiles.push(...files);
                    this.render();
                }
                $('#fileInput').val(''); // 같은 파일 재선택 가능
            });

            // 파일 삭제
            $(document).off('click', '.delete-file-btn').on('click', '.delete-file-btn', (e) => {
                const $item = $(e.currentTarget).closest('.file-item');
                const type = $item.data('type');
                const index = $item.data('index');

                if (type === 'server') {
                    const fileNo = $item.data('file-no');
                    const sno = $item.data('sno');
                    this.removedFiles.push({ fileNo, sno });
                    this.serverFiles.splice(index, 1);
                } else {
                    this.newFiles.splice(index, 1);
                }
                this.render();
            });
        },
        render() {
            const $list = $('#fileList');
            $list.empty();

            // 서버 파일
            this.serverFiles.forEach((f, i) => {
                $list.append(`
                <li class="file-item" data-type="server" data-index="${i}" data-file-no="${f.fileNo}" data-sno="${f.sno}">
                    <a class="file-name" href="/api/construction/qualityinspection/${f.fileNo}/${f.sno}/file-download" target="_blank">${f.fileNm}</a>
                    <button type="button" class="delete-file-btn">❌</button>
                </li>
            `);
            });

            // 신규 파일
            this.newFiles.forEach((f, i) => {
                $list.append(`
                <li class="file-item" data-type="new" data-index="${i}">
                    <span class="file-name">${f.name}</span>
                    <button type="button" class="delete-file-btn">❌</button>
                </li>
            `);
            });

            if (this.serverFiles.length === 0 && this.newFiles.length === 0) {
                $list.html('<p class="empty">첨부 파일이 없습니다.</p>');
            }
        },
    }
    window.photo = window.photo || {
        photoArr: [],
        deleteSno: [],

        init(photos = []) {
            this.photoArr = photos.map(p => ({
                fileNo: p.fileNo,
                sno: p.sno,
                imgSrc: p.imgSrc,
                titlNm: p.titlNm,
                fileDscrpt: p.fileDscrpt,
                shotDateFmt: p.shotDateFmt,
            }));
            this.render();
            this.bindEvents();
        },

        resetModal() {
            $('#titlNm, #dscrpt, #shotDate').val('');
            $('#photoFile, #photoCamera').val('');
            $('#photoPreviewWrap').hide();
            $('#selectedPhotoName').text('');
            $('#photoPreview').attr('src', '');
            $('#photoPreview').removeData('file');
        },

        bindEvents() {
            // 모달 열기/닫기
            $(document).on('click', '#btnAddPhoto', () => {
                $('#photoModal').show();
                $('#shotDate').val(new Date().toISOString().split('T')[0]);
            });
            $(document).on('click', '#btnClosePhotoModal', () => $('#photoModal').hide());

            // 파일 선택 or 촬영
            $(document).on('click', '#btnSelectPhoto', () => $('#photoFile').click());
            $(document).on('click', '#btnTakePhoto', () => $('#photoCamera').click());

            // 선택/촬영 후 미리보기
            $(document).on('change', '#photoFile, #photoCamera', (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const blobUrl = URL.createObjectURL(file);
                $('#photoPreview').attr('src', blobUrl);
                $('#photoPreviewWrap').show();
                $('#selectedPhotoName').text(file.name);
                $('#photoPreview').data('file', file);
            });

            // 사진 저장 버튼
            $(document).on('click', '#btnSavePhoto', () => {
                const title = $('#titlNm').val().trim();
                const desc = $('#dscrpt').val().trim();
                const date = $('#shotDate').val();
                const file = $('#photoPreview').data('file');

                if (!title) {
                    alert('제목을 입력해주세요.');
                    return;
                }

                if (!desc) {
                    alert('설명을 입력해주세요.');
                    return;
                }

                if (!file) {
                    alert('사진을 선택하거나 촬영하세요.');
                    return;
                }

                this.photoArr.push({
                    titlNm: title || '무제',
                    dscrpt: desc,
                    shotDateFmt: date,
                    imgSrc: URL.createObjectURL(file),
                    file
                });

                // 초기화
                $('#titlNm, #dscrpt, #shotDate').val('');
                $('#photoFile, #photoCamera').val('');
                $('#photoPreviewWrap').hide();
                $('#selectedPhotoName').text('');
                $('#photoModal').hide();

                this.render();
            });

            // 사진 삭제
            $(document).on('click', '.delete-photo-btn', (e) => {
                const $item = $(e.currentTarget).closest('.photo-item');
                const sno = $item.data('sno');
                const index = $item.data('index');

                this.deleteSno = this.deleteSno || [];
                this.deletePhtSno = this.deletePhtSno || [];

                if (sno) {
                    this.deleteSno.push(sno);
                    this.deletePhtSno.push(sno);

                    console.log('🗑️ 사진 삭제 클릭됨');
                    console.log('삭제 대상 sno:', sno);
                    console.log('deleteSno 배열:', this.deleteSno);
                    console.log('deletePhtSno 배열:', this.deletePhtSno);
                } else {
                    console.warn('⚠️ sno가 존재하지 않아 삭제 배열에 추가되지 않음');
                }

                // 실제 배열에서 제거
                this.photoArr.splice(index, 1);
                this.render();
            });

        },

        render() {
            const $list = $('#photoList');
            $list.empty();

            if (!this.photoArr.length) {
                $list.html('<p class="empty">사진 파일이 없습니다.</p>');
                return;
            }

            this.photoArr.forEach((p, i) => {
                $list.append(`
                <div class="photo-item" data-index="${i}" data-file-no="${p.fileNo || ''}" data-sno="${p.sno || ''}">
                    <img src="${p.imgSrc}" class="thumb">
                    <div class="photo-meta">
                        <p class="photo-title">${p.titlNm || '-'}</p>
                        <p class="photo-desc">${p.fileDscrpt || ''}</p>
                    </div>
                    <button type="button" class="delete-photo-btn">❌</button>
                </div>
            `);
            });
        },
    };
</script>
