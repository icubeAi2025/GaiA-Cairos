<link rel="stylesheet" href="/assets/mo/css/quality-mo.css">

<section id="contentWrap"></section>

<script id="content-template" type="text/x-handlebars-template">
    <div class="quality-mo-container">

        <!-- Header -->
        <header class="mo-header">
            <button class="back-btn" onclick="history.back()">←</button>
            <h2>품질검측 상세조회</h2>
        </header>

        <!-- 검측 요청 정보 -->
        <div class="section">
            <h3 class="section-title">검측 요청 정보</h3>
            <div class="info-card">
                <div class="info-row">
                    <strong>문서 번호</strong>
                    <span>{{data.quality.rsltDocNo}}</span>
                </div>
                <div class="info-row">
                    <strong>요청 일자</strong>
                    <span>{{formatDate data.quality.ispReqDt}}</span>
                </div>
                <div class="info-row">
                    <strong>공종 상세</strong>
                    <span>{{data.quality.cnsttyCdKrn}}</span>
                </div>
                <div class="info-row">
                    <strong>Activity</strong>
                    <span>
                        {{#each data.activitys}}
                            {{this.activityNm}}<br>
                        {{/each}}
                    </span>
                </div>
                <div class="info-row">
                    <strong>검측 사항</strong>
                    <span>{{data.quality.ispIssue}}</span>
                </div>
            </div>
        </div>

        <!-- 첨부 파일 요약 -->
        <div class="section">
            <h3 class="section-title">첨부 파일 요약</h3>

            <div class="info-card">
                <div class="info-row">
                    <strong>사진 첨부</strong>
                    <span>{{data.photoCnt}} 개</span>
                </div>
                <div class="info-row">
                    <strong>일반 파일</strong>
                    <span>{{data.fileCnt}} 개</span>
                </div>

                <div class="info-row link-row">
                    <a href="#" class="view-detail" onclick="toggleAttachmentList(event)">자세히 보기</a>
                </div>
            </div>

            <!-- 숨겨진 첨부파일 리스트 -->
            <div id="attachmentList" class="attachment-list" style="display:none;">
                <div class="file-section">
                    <h4>일반 파일</h4>
                    {{#if data.attachments.length}}
                        <ul>
                            {{#each data.attachments}}
                                <li>
                                    <a href="/api/construction/qualityinspection/{{this.fileNo}}/{{this.sno}}/file-download"
                                    target="_blank">{{this.fileNm}}</a>
                                </li>
                            {{/each}}
                        </ul>
                    {{else}}
                        <p class="empty">첨부 파일이 없습니다.</p>
                    {{/if}}
                </div>
                
                <div class="file-section">
                    <h4>사진 파일</h4>
                    {{#if data.mergedPhotos.length}}
                        <div class="photo-grid">
                            {{#each data.mergedPhotos}}
                                <div class="photo-item">
                                    <img src="{{this.imgSrc}}" alt="{{this.fileName}}" class="thumb">
                                    <div class="photo-meta">
                                        <p class="photo-title"><br>{{this.titlNm}}</p>
                                    </div>
                                </div>
                            {{/each}}
                        </div>
                    {{else}}
                        <p class="empty">사진 파일이 없습니다.</p>
                    {{/if}}
                </div>
            </div>
        </div>

        <!-- 체크리스트 -->
        <div class="section">
            <h3 class="section-title">체크리스트 확인</h3>

            <div class="info-card checklist-box">

                <div class="checklist-header">
                    <span class="col-item">검사 항목</span>
                    <span class="col-site">시공</span>
                </div>
                {{#if data.checkList.length}}
                    <ul class="checklist-list">
                        {{#each data.checkList}}
                        <li class="checklist-row">
                            <div class="check-content">
                                <span class="check-title">{{this.chklstSno}}. {{this.chklstDscrpt}}</span>
                                <div class="check-icons">
                                    <input type="checkbox" {{#if (eq this.cnstrtnYn 'Y')}}checked{{/if}} disabled>
                                </div>
                            </div>
                        </li>
                        {{/each}}
                    </ul>
                {{else}}
                    <p class="empty">등록된 체크리스트가 없습니다.</p>
                {{/if}}
            </div>
        </div>

        <!-- Footer -->
        <footer class="mo-footer btn-area">
            <button type="button" class="btn-primary" id="btnDelete">삭제</button>
            <button type="button" class="btn-secondary" id="btnRequestTech">검측요청</button>
        </footer>

    </div>
</script>

<script>
    Handlebars.registerHelper('formatDate', function (dateString) {
        if (!dateString) return '';
        const d = new Date(dateString);
        const yyyy = d.getFullYear();
        const mm = String(d.getMonth() + 1).padStart(2, '0');
        const dd = String(d.getDate()).padStart(2, '0');
        return `${yyyy}-${mm}-${dd}`;
    });

    Handlebars.registerHelper('eq', function (a, b) {
        return a === b;
    });

    function getUrlParam(name) {
        const query = location.hash.split('?')[1] || '';
        const params = new URLSearchParams(query);
        return params.get(name);
    }

    function loaded(pjtNo, cntrctNo) {
        const qltyIspId = getUrlParam('qltyIspId');

        console.log('품질 검측 상세조회 로딩', { pjtNo, cntrctNo, qltyIspId });

        if (!qltyIspId) {
            gaiaCommon.customAlert('검측 ID가 없습니다.');
            return;
        }

        gaiaCommon.get(`/api/construction/qualityinspection/get/quality/${cntrctNo}/${qltyIspId}`, {}, function (res) {
            console.log("data: ", res)

            const details = res.details;
            console.log('상세데이터: ', details);

            // 파일 개수 계산
            details.photoCnt = details.photoAttachments.length;
            details.fileCnt = details.attachments.length;

            // photoList + photoAttachments 병합
            const photoMap = {};
            (details.photoAttachments || []).forEach(att => {
                photoMap[att.sno] = att;
            });

            details.mergedPhotos = (details.photoList || []).map(photo => {
                const file = photoMap[photo.phtSno] || {};
                let formattedDate = '';
                if (Array.isArray(photo.shotDate)) {
                    const [y, m, d] = photo.shotDate;
                    formattedDate = `${y}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                }

                // 경로 정제 처리
                let webPath = file.fileDiskPath || '';
                if (webPath.includes('\\')) {
                    // 윈도우 경로 → /upload 부터 시작하도록 치환
                    webPath = webPath.replace(/^.*\\upload/, '/upload').replace(/\\/g, '/');
                } else {
                    // 리눅스 경로
                    webPath = webPath.replace(/^.*\/upload/, '/upload');
                }

                const imgSrc = `${webPath}/${file.fileDiskNm}`;

                return {
                    ...photo,
                    filePath: webPath,
                    fileName: file.fileNm,
                    fileDiskNm: file.fileDiskNm,
                    imgSrc: imgSrc,
                    shotDateFmt: formattedDate
                };
            });
            console.log('mergedPhotos:', details.mergedPhotos);

            $('#contentWrap').html(
                tware.utils.handlebarCompile($('#content-template').html(), details)
            );
        });
    }

    function toggleAttachmentList(e) {
        e.preventDefault();
        const list = document.getElementById('attachmentList');
        if (!list) return;

        if (list.style.display === 'none') {
            list.style.display = 'block';
            e.target.textContent = '닫기';
        } else {
            list.style.display = 'none';
            e.target.textContent = '자세히 보기';
        }
    }
</script>
